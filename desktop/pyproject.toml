[project]
name = "timologio-downloader"
version = "0.4.21"
description = "Μαζική λήψη παραστατικών myDATA (ΑΑΔΕ) για πολλαπλούς πελάτες"
readme = "README.md"
authors = [
    { name = "scanmydata", email = "scanmydata@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=49.0.0",
    "requests>=2.34.2",
    # Τα Windows δεν έχουν βάση ζωνών ώρας: χωρίς αυτό, το ZoneInfo("Europe/Athens")
    # αποτυγχάνει και το αρχείο καταγραφής γράφει ώρα μηχανήματος αντί για ώρα
    # Ελλάδας — σιωπηλά λάθος σε όποιον υπολογιστή δεν είναι ρυθμισμένος σωστά.
    "tzdata>=2025.1",
]

[project.optional-dependencies]
gui = [
    "pyside6>=6.11.1",
    # Οδηγεί τον εγκατεστημένο Edge/Chrome μέσω DevTools (CDP over websocket) για
    # τη λήψη των «μόνο online» παραστατικών. Καθαρά Python — χωρίς driver.
    "websocket-client>=1.8.0",
    # Εξαγωγή σε Excel (.xlsx) με πραγματικό πίνακα (autofilter/ταξινόμηση).
    "openpyxl>=3.1",
    # QR για την εγγραφή 2FA στο e-Τιμολόγιο Pro. Καθαρά Python (διαβάζουμε το
    # get_matrix() και ζωγραφίζουμε με Qt) — δεν χρειάζεται Pillow.
    "qrcode>=8.0",
]
# Φωνητική είσοδος για τον ψηφιακό βοηθό, εκτός δικτύου. Ξεχωριστό extra και όχι
# μέρος του `gui`: σέρνει native βιβλιοθήκες και απαιτεί το ελληνικό μοντέλο
# (~1.1 GB, βλ. `build.ps1 -WithVoice`). Χωρίς αυτό ο βοηθός δουλεύει με κείμενο
# και το κουμπί του μικροφώνου εξηγεί τι λείπει.
voice = [
    "vosk>=0.3.45",
    "sounddevice>=0.4.6",
]
# Αντίγραφα ασφαλείας στο Google Drive. Ξεχωριστό extra: το πακετάρισμα του
# αρχείου δουλεύει ΠΑΝΤΑ (τοπικό zip με βάση + .enckey)· μόνο η μεταφόρτωση
# χρειάζεται αυτές τις βιβλιοθήκες. Τα μυστικά έρχονται από Infisical, ποτέ από
# αρχείο ρυθμίσεων — ίδιο μοτίβο με το ScanmyData.
drive = [
    "google-api-python-client>=2.100",
    "google-auth>=2.30",
]

[project.scripts]
timologio = "timologio.cli:main"


[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "timologio"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.21",
]
