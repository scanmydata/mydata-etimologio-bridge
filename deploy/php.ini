; e-Τιμολόγιο Pro — ρυθμίσεις PHP για τον container (conf.d/etimologio.ini)
;
; Το php:8.3-apache ΔΕΝ έχει καθόλου php.ini: ισχύουν τα ενσωματωμένα defaults
; της PHP, δηλαδή display_errors=On (stack trace με το DSN κατευθείαν στον
; browser), memory_limit=128M και max_execution_time=30 — λίγα για μαζική
; εξαγωγή PDF/ZIP από την ΑΑΔΕ. Οι τιμές μεγέθους/χρόνου ξαναγράφονται στο boot
; από το entrypoint (PHP_MEMORY_LIMIT / PHP_MAX_EXECUTION_TIME / …), ώστε να
; ρυθμίζονται από το Coolify χωρίς rebuild.

; --- Σφάλματα: ποτέ στον χρήστη, πάντα στο log του container ----------------
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Όρια -------------------------------------------------------------------
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
; Αντίγραφα κίνησης τραπέζης (xlsx/csv) και μαζικά payload έκδοσης.
upload_max_filesize = 32M
post_max_size = 40M
max_input_vars = 5000

; --- Ώρα --------------------------------------------------------------------
; Ο χρονοπρογραμματισμός αποθηκεύει «τοπική ώρα Ελλάδας»· ο container πρέπει να
; συμφωνεί, αλλιώς οι εργασίες τρέχουν με ώρα UTC.
date.timezone = Europe/Athens

; --- Ασφάλεια ---------------------------------------------------------------
expose_php = Off
session.name = ETIM_SID
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.gc_maxlifetime = 28800
; Οι συνεδρίες ΔΕΝ μένουν στο /tmp του container: κάθε deploy φτιάχνει νέο
; container, το /tmp γεννιέται άδειο, και όλοι πετιούνται έξω στη μέση της
; δουλειάς τους — με τη φόρμα σύνδεσης να εμφανίζεται σαν να έληξε ο κωδικός.
; Ο φάκελος φτιάχνεται στο entrypoint, μέσα στο volume που ούτως ή άλλως
; κρατάει τη βάση και το κλειδί.
session.save_path = "/data/.sessions"
; Το session.cookie_secure ΔΕΝ ορίζεται εδώ: το auth.php το ενεργοποιεί μόνο του
; όταν το αίτημα ήρθε μέσω HTTPS (X-Forwarded-Proto από το cloudflared). Σταθερό
; «1» θα έσπαγε την τοπική/offline λειτουργία σε http://127.0.0.1.

; --- Απόδοση ----------------------------------------------------------------
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 30
realpath_cache_size = 4096k
