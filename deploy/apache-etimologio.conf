# e-Τιμολόγιο Pro — Apache ρυθμίσεις για την έκθεση στο internet
# (conf-available/etimologio.conf, ενεργό μέσω a2enconf).
#
# Ο container κάθεται πίσω από cloudflared/Coolify και σερβίρει ΔΥΟ πράγματα:
# το web UI (app.php) και το JSON API (etimologio.php). Ό,τι άλλο υπάρχει στον
# φάκελο είναι βιβλιοθήκη ή εργαλείο και ΔΕΝ πρέπει να απαντά σε αίτημα από έξω.

ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    # Χωρίς λίστα αρχείων και χωρίς .htaccess (η ρύθμιση ζει εδώ).
    Options -Indexes -FollowSymLinks +SymLinksIfOwnerMatch
    AllowOverride None
    Require all granted
    # Η ρίζα του hostname σερβίρει την εφαρμογή ΧΩΡΙΣ redirect. Ήταν εδώ ένα
    # `RedirectMatch 302 "^/$" "/app.php"` και ήταν λάθος: ο Apache χτίζει την
    # απόλυτη διεύθυνση του 302 από το ServerName και τη ΘΥΡΑ ΤΟΥ, οπότε ο
    # χρήστης έπαιρνε «πήγαινε στο http://etimologio:8090/app.php» — εσωτερική
    # διεύθυνση, σε http, που δεν υπάρχει έξω από το docker network. Το
    # DirectoryIndex κάνει την ίδια δουλειά χωρίς να πει ποτέ διεύθυνση.
    DirectoryIndex app.php

    # HTTP -> HTTPS. Η Cloudflare τερματίζει το TLS και προωθεί σε καθαρό http,
    # οπότε τι ζήτησε ΠΡΑΓΜΑΤΙΚΑ ο χρήστης το λέει μόνο το X-Forwarded-Proto.
    #
    # ΓΙΑΤΙ ΕΔΩ ΜΕΣΑ κι όχι σε server context: οι κανόνες του mod_rewrite ΔΕΝ
    # κληρονομούνται μέσα στο <VirtualHost> (χρειάζεται RewriteOptions Inherit).
    # Ο ίδιος κανόνας απ' έξω δεν πυροδοτούσε ποτέ.
    #
    # Η συνθήκη πιάνει ΜΟΝΟ ρητό `http`: ένα αίτημα χωρίς την κεφαλίδα — το
    # τοπικό `curl http://127.0.0.1:8090/healthz.php` του healthcheck και του
    # χρονοπρογραμματιστή — δεν μπαίνει σε redirect και συνεχίζει να απαντά.
    #
    # Το ίδιο πράγμα λύνεται και με ένα κλικ στην Cloudflare (SSL/TLS → Edge
    # Certificates → Always Use HTTPS), αλλά εκείνο πιάνει ΟΛΗ τη ζώνη
    # scanmydata.gr. Εδώ αφορά μόνο αυτό το hostname.
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{HTTP:X-Forwarded-Proto} =http
        RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
    </IfModule>
</Directory>

# --- Τι ΔΕΝ σερβίρεται ------------------------------------------------------

# Κρυφά αρχεία: .enckey, .cookies/, .env, .git — αν ποτέ βρεθούν στο web root.
<DirectoryMatch "/\.">
    Require all denied
</DirectoryMatch>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# Μυστικά, βάσεις, τεκμηρίωση, εργαλεία γραμμής εντολών.
<FilesMatch "\.(ini|sqlite|sqlite-.*|md|txt|log|lock|yml|yaml|sh|py|dist|example)$">
    Require all denied
</FilesMatch>
<Files "config.php">
    Require all denied
</Files>
<Files "config.example.php">
    Require all denied
</Files>
<Files "scheduler.php">
    # CLI-only ούτως ή άλλως (PHP_SAPI check), αλλά ας μη φαίνεται καν.
    Require all denied
</Files>
<Files "Dockerfile">
    Require all denied
</Files>

# Βιβλιοθήκες: τις φορτώνει το app.php/etimologio.php από το filesystem, δεν
# έχουν νόημα ως URL. Η άμεση κλήση τους δεν παράγει έξοδο, αλλά μια μελλοντική
# αλλαγή δεν πρέπει να μπορεί να τις κάνει σημείο εισόδου.
<FilesMatch "^(auth|authview|localdb|crypto|mail|totp|zipwriter|bankimport)\.php$">
    Require all denied
</FilesMatch>

<DirectoryMatch "^/var/www/html/(tools|deploy|docs|desktop)(/|$)">
    Require all denied
</DirectoryMatch>

# --- Κεφαλίδες --------------------------------------------------------------
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "geolocation=(), camera=(), payment=()"
    # Το API είναι δυναμικό — καμία cache, ούτε στη Cloudflare ούτε στον browser.
    <FilesMatch "^etimologio\.php$">
        Header always set Cache-Control "no-store, no-cache, must-revalidate"
    </FilesMatch>
    # Στατικά: ασφαλές να μείνουν στην άκρη του δικτύου.
    <FilesMatch "\.(png|ico|webmanifest|js|css|woff2?)$">
        Header set Cache-Control "public, max-age=86400"
    </FilesMatch>
</IfModule>
